{% extends "base.html" %}

{% block content %}
<div class="min-h-screen p-8 flex items-center justify-center">
    <div class="glass-card-strong p-8 max-w-md w-full fade-in-up">
        <div class="text-center mb-6">
            <div class="w-16 h-16 rounded-full bg-gradient-to-br from-fresh-shoot to-deep-growth flex items-center justify-center mx-auto mb-4">
                <svg class="w-8 h-8 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0zm6 3a2 2 0 11-4 0 2 2 0 014 0zM7 10a2 2 0 11-4 0 2 2 0 014 0z"></path>
                </svg>
            </div>
            <h2 class="text-3xl font-bold text-graphite">Create Community</h2>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="bg-red-500/20 border border-red-500/50 text-red-700 px-4 py-3 rounded-lg mb-4">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" class="space-y-6">
            <div>
                <label class="block text-graphite font-medium mb-2">Community Name</label>
                <input 
                    type="text" 
                    name="community_name" 
                    required 
                    class="input-glass w-full"
                    placeholder="Enter community name"
                >
            </div>

            <div>
                <label class="block text-graphite font-medium mb-2">Subject</label>
                <input 
                    type="text" 
                    name="subject" 
                    required 
                    class="input-glass w-full"
                    placeholder="e.g., Web Development, Data Science"
                >
            </div>

            <button 
                type="submit" 
                class="btn-primary w-full"
            >
                <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                </svg>
                Create Community
            </button>

            <a href="{{ url_for('community_routes.explore_communities') }}" class="btn-outline w-full block text-center">
                Cancel
            </a>
        </form>
    </div>
</div>
{% endblock %}
