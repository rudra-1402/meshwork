{% extends "base.html" %}

{% block content %}
<div style="max-width: 500px; margin: 50px auto; padding: 20px; border: 1px solid #ddd; border-radius: 6px;">

    <h2 style="text-align: center;">Create Community</h2>

    <!-- Flash messages -->
    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p style="color: red; text-align: center;">{{ message }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">

        <div style="margin-bottom: 15px;">
            <label>Community Name</label><br>
            <input 
                type="text" 
                name="community_name" 
                required 
                style="width: 100%; padding: 8px;"
            >
        </div>

        <div style="margin-bottom: 15px;">
            <label>Subject</label><br>
            <input 
                type="text" 
                name="subject" 
                required 
                style="width: 100%; padding: 8px;"
            >
        </div>

        <button 
            type="submit" 
            style="width: 100%; padding: 10px; background-color: #007bff; color: white; border: none;"
        >
            Create Community
        </button>

    </form>

</div>
{% endblock %}
