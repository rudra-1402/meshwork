{% extends "base.html" %}

{% block content %}
<div class="min-h-screen flex items-center justify-center p-8">
    <div class="glass-card-strong p-12 max-w-2xl text-center fade-in-up">
        <!-- Lock Icon with glow -->
        <div class="mb-8 inline-block">
            <div class="relative">
                <svg class="w-32 h-32 text-safety-orange animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                </svg>
                <div class="absolute inset-0 blur-2xl bg-safety-orange opacity-30 animate-pulse"></div>
            </div>
        </div>
        
        <div class="text-6xl font-bold text-safety-orange mb-4">403</div>
        <h2 class="text-3xl font-bold text-graphite mb-4">Access Denied</h2>
        <p class="text-graphite/70 text-lg mb-8">
            You don't have permission to access this resource. This area is restricted.
        </p>
        
        <div class="flex flex-col sm:flex-row gap-4 justify-center">
            <a href="{{ url_for('dashboard.dashboard') }}" class="btn-primary">
                <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path>
                </svg>
                Go Home
            </a>
            <a href="javascript:history.back()" class="btn-outline">
                <svg class="w-5 h-5 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path>
                </svg>
                Go Back
            </a>
        </div>
    </div>
</div>
{% endblock %}
