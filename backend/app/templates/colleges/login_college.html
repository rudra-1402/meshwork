{% extends "base.html" %}
{% block content %}

<h2>College Login</h2>

<form method="POST" action="/login/college">
    <label>Email</label>
    <input type="email" name="email" required>

    <label>Password</label>
    <input type="password" name="password" required>

    <button type="submit">Login</button>
</form>

{% endblock %}
