{% extends "base.html" %}
{% block content %}

<div class="min-h-screen flex items-center justify-center p-8">
    <div class="w-full max-w-2xl">
        <div class="text-center mb-8 fade-in-up">
            <div class="text-5xl mb-4">🎓</div>
            <h1 class="text-4xl font-bold text-graphite mb-3">Personnel Registration</h1>
            <div class="glass-card inline-block px-6 py-3">
                <p class="text-graphite font-semibold">{{ college.name }}</p>
            </div>
        </div>
        
        <div class="glass-card-strong p-10 fade-in-up stagger-1">
            <form method="POST" action="/signup/personnel/{{ college.id }}" class="space-y-6">
                
                <!-- Personal Information -->
                <div>
                    <h3 class="text-xl font-bold text-graphite mb-4">Personal Information</h3>
                    
                    <div class="grid grid-cols-2 gap-4 mb-4">
                        <div>
                            <label class="block text-graphite font-medium mb-2">First Name *</label>
                            <input type="text" name="first_name" class="input-glass" required>
                        </div>
                        
                        <div>
                            <label class="block text-graphite font-medium mb-2">Last Name *</label>
                            <input type="text" name="last_name" class="input-glass" required>
                        </div>
                    </div>
                    
                    <div>
                        <label class="block text-graphite font-medium mb-2">Email *</label>
                        <input type="email" name="email" class="input-glass" placeholder="your-id@college.edu" required>
                        <small class="text-graphite/60 text-xs block mt-1">Must match college personnel email pattern</small>
                    </div>
                </div>
                
                <!-- Role & ID -->
                <div class="pt-6 border-t border-graphite/20">
                    <h3 class="text-xl font-bold text-graphite mb-4">Role & Identification</h3>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-graphite font-medium mb-2">Role *</label>
                            <select name="role" class="input-glass" required>
                                <option value="">-- Select Role --</option>
                                {% for role in valid_roles %}
                                    <option value="{{ role }}">{{ role.upper() if role == 'hod' else role.capitalize() }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        
                        <div>
                            <label class="block text-graphite font-medium mb-2">Personnel ID</label>
                            <input type="text" name="personnel_id" class="input-glass" placeholder="e.g., EMP001">
                            <small class="text-graphite/60 text-xs">Optional</small>
                        </div>
                    </div>
                </div>
                
                <!-- Security -->
                <div class="pt-6 border-t border-graphite/20">
                    <h3 class="text-xl font-bold text-graphite mb-4">Security</h3>
                    
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-graphite font-medium mb-2">Password *</label>
                            <input type="password" name="password" class="input-glass" required minlength="6" placeholder="Minimum 6 characters">
                        </div>
                        
                        <div>
                            <label class="block text-graphite font-medium mb-2">Confirm Password *</label>
                            <input type="password" name="confirm_password" class="input-glass" required placeholder="Re-enter password">
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="w-full btn-success mt-8">Register</button>
            </form>
            
            <div class="mt-6 pt-6 border-t border-graphite/20 text-center">
                <p class="text-graphite/70">
                    Already have an account? <a href="/login/personnel" class="text-deep-growth font-semibold hover:text-fresh-shoot transition-colors">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>

{% endblock %}
