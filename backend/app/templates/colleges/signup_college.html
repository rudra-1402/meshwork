{% extends "base.html" %}
{% block content %}

<h2>College Signup</h2>

<form method="POST" action="/signup/college">

    <label>College Name</label><br>
    <input type="text" name="name" required><br><br>

    <label>Official College Email Domain</label><br>
    <input type="text" name="email" placeholder="mail.ljku.edu.in" required><br><br>
    
    <label>City</label><br>
    <input type="text" name="city" required><br><br>

    <label>State</label><br>
    <input type="text" name="state" required><br><br>

    <label>College Address</label><br>
    <textarea name="address" required></textarea><br><br>

    <h3>Registered By</h3>

    <label>First Name</label><br>
    <input type="text" name="first_name" required><br><br>

    <label>Last Name</label><br>
    <input type="text" name="last_name" required><br><br>

    <label>Position</label><br>
    <input type="text" name="position" placeholder="Admin / Principal" required><br><br>

    <label>Password</label><br>
    <input type="password" name="password" required><br><br>

    <label>Confirm Password</label><br>
    <input type="password" name="confirm_password" required><br><br>

    <button type="submit">Register College</button>
</form>

{% endblock %}
